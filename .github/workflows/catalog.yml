name: Build catalog

# Baut den Slim-Katalog aus dem Scryfall-Bulk und hängt ihn ans Release
# (PLAN.md § 2 „CI", M1). Generierte Kartendaten liegen NICHT im Repo — sie
# entstehen hier und leben im Release.

on:
  schedule:
    # Wöchentlich, Montag 04:17 UTC (versetzt, um Runner-Spitzen zu meiden).
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write # Releases anlegen/aktualisieren

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install -r pipeline/requirements.txt

      - name: Build catalog
        working-directory: pipeline
        run: python fetch_scryfall.py --out dist

      - name: Show output
        run: |
          ls -lh pipeline/dist
          cat pipeline/dist/version.json

      - name: Tagged release (archive)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%Y%m%d)
          TAG="catalog-$DATE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" pipeline/dist/*.ndjson pipeline/dist/version.json --clobber
          else
            gh release create "$TAG" pipeline/dist/*.ndjson pipeline/dist/version.json \
              --title "Catalog $DATE" \
              --notes "Slim-Katalog aus dem Scryfall-Bulk (DE+EN). Automatisch erzeugt."
          fi

      - name: Rolling 'latest' release (stable URL for the app)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="catalog-latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" pipeline/dist/*.ndjson pipeline/dist/version.json --clobber
          else
            gh release create "$TAG" pipeline/dist/*.ndjson pipeline/dist/version.json \
              --title "Catalog (latest)" \
              --notes "Immer der aktuellste Katalog. Die App lädt von hier." \
              --latest=false
          fi
